<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function checkAge(){
            var age = document.getElementById("age").value;
            var message = document.getElementById("message");

            if(age <40){
                message.innerHTML = "To be a part of the community, you need to at least 40";
                message.style.color = "black";
            }
            else if(age >= 40 && age <=50){
                message.innerHTML = "You are the youngsters of this community";
                message.style.color = "black";
            }
            else if(age>50){
                message.innerHTML = "Top level members of the group";
                message.style.color = "red";
            }
        }
    </script>
</head>
<body>
    <form oninput="checkAge()">
        <label for="">Enter your Age: </label>
        <input type="text" name="" id="age" required>
        <br><br>
    </form>

    <h1 id="message"></h1>
    <!-- <p id="message"></p> -->
</body>
</html>
