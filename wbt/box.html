<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>box</title>
    <style>
        body{
           margin: 0;
           padding: 0;
        }
        .container{
            position: relative;
            width: 300px;
            height: 200px;
            border: 2px solid black;
            padding: 10px;
            box-sizing: border-box;
            text-align: center;
            margin-left: 20px;
            padding-top: 50px;
        }
        .bottom-right{
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 100px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid black;
        }

    </style>
</head>
<body>
    <h1>Absolute Position Example</h1>
    <div class="container">
        <h1>Container Area</h1>
        <div class="bottom-right">Bottom <br> Right</div>
    </div>
</body>
</html>
